name: Publish r-stat-301-pl-autograder on DockerHub
on: 
  push: 
    paths: 
      - 'dockerfiles/r-stat-301-pl-autograder/Dockerfile'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: "master"

    - name: Create release tag
      id: release
      shell: bash
      run: echo "tag=$(git rev-parse --short=6 HEAD)" >> $GITHUB_OUTPUT

    - name: Build and publish STAT 301 pl autograder image
      uses: elgohr/Publish-Docker-Github-Action@v5
      with:
        name: ubcdsci/r-stat-301-pl-autograder
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        workdir: "r-stat-301-pl-autograder"
        tags: "latest,${{ steps.release.outputs.tag }}"